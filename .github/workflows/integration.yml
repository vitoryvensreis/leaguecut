name: Teste integrado LeagueCut
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'app/**'
      - 'public/**'
      - 'bin/**'
      - 'database/**'
      - 'composer.json'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'app/**'
      - 'public/**'
      - 'bin/**'
      - 'database/**'
      - 'composer.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,curl,openssl,fileinfo
          tools: composer
      - name: Validar sintaxe PHP antes dos testes
        run: |
          set -euo pipefail
          find app public bin -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Instalar dependencias
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Preparar banco de teste descartavel
        run: |
          mysql --host=127.0.0.1 --user=root --password=integration -e "CREATE DATABASE leaguecut CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql --host=127.0.0.1 --user=root --password=integration leaguecut < database/schema.sql
      - name: Verificar migração idempotente
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: leaguecut
          DB_USER: root
          DB_PASSWORD: integration
          DB_BACKUP_DIR: /tmp/leaguecut-ci-db-backups
        run: |
          php bin/migrate.php
          php bin/migrate.php
          php tests/oauth-collation.php
      - name: Iniciar aplicacao em localhost
        env:
          APP_URL: http://127.0.0.1:8080
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: leaguecut
          DB_USER: root
          DB_PASSWORD: integration
          HOME_MEDIA_DIR: /tmp/leaguecut-home-media
          BRAND_MEDIA_DIR: /tmp/leaguecut-brand-media
          SEO_MEDIA_DIR: /tmp/leaguecut-seo-media
          LC_E2E_FAKE_DRIVE: '1'
        run: |
          export APP_KEY="$(php -r 'echo base64_encode(random_bytes(32));')"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/leaguecut-php.log 2>&1 &
          echo $! > /tmp/leaguecut-pid
          php bin/realtime-server.php > /tmp/leaguecut-ws.log 2>&1 &
          echo $! > /tmp/leaguecut-ws-pid
          sleep 3
          if ! grep -q 'LEAGUECUT_WS_LISTENING' /tmp/leaguecut-ws.log; then
            cat /tmp/leaguecut-ws.log
            exit 1
          fi
      - name: Testar operacao fim a fim
        env:
          APP_URL: http://127.0.0.1:8080
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: leaguecut
          DB_USER: root
          DB_PASSWORD: integration
        run: |
          set -e
          curl --fail --silent http://127.0.0.1:8080/health
          python3 tests/smoke.py
          python3 tests/pwa_install_smoke.py
          python3 tests/creator_subscriptions_smoke.py
          php tests/creator_schema.php
          php tests/creator_billing_cycles.php
          php tests/nickname_ranking.php
          php tests/rank_trophies.php
          php tests/referrals.php
          php tests/multiple_monthly_bonus.php
          php tests/privacy_ui.php
          php tests/privacy_center.php
          php tests/legal_entity.php
          php tests/seo_security.php
          php tests/share_card.php
          php tests/social_footer.php
          php tests/password_reset.php
          php tests/remember_device.php
          php tests/devices.php
          php tests/notice_targeting.php
          php tests/pwa_security.php
          php -r 'require "app/brand-images.php"; $mask=lc_brand_masks(); foreach($mask as $entry){if(strlen($entry["mask"])!==$entry["w"]*$entry["h"])exit(1);} echo "BRAND_MASK_OK\\n";'
          php tests/push_storage.php
          php tests/push_vapid_queue.php
          php tests/push_selftest.php
          php tests/support_tickets.php
          php tests/support_actions.php
          php tests/support_listing.php
          php tests/support_management.php
          node --check public/assets/background-push.js
          node --check public/assets/pwa.js
          node --check public/assets/notification-preferences.js
          node --check public/assets/admin-notices.js
          php tests/campaign_ranking.php || { tail -n 120 /tmp/leaguecut-php.log; exit 1; }
          php tests/automation_rules.php
          php tests/automation_visual.php
          php tests/account_admin.php
          php tests/demo_mode.php
          php tests/account_deletion_integration.php
          php tests/master_admin_permissions.php
          php tests/asaas_foundation.php
          php tests/asaas_connection.php
          php tests/asaas_pix_tests.php
          php tests/mfa_security.php
          php tests/mfa_qr_audit.php
          php tests/otp_security.php
          php tests/wpp_status.php
          node --check public/assets/input-masks.js
          node tests/masks-b4b.cjs
          node --check public/assets/flow-editor.js
          node --check public/assets/flow-canvas-v2.js
          python3 tests/ux_smoke.py || { tail -n 120 /tmp/leaguecut-php.log; exit 1; }
          php tests/apify_actor_sample.php
          php tests/apify_eligibility.php
          php tests/daily_brand.php
          php -r 'require "app/core.php"; require "app/apify.php"; $row=["shortcode"=>"ABCde12","ownerUsername"=>"criador.validado","videoPlayCount"=>321]; if(lc_apify_post_views($row,"criador.validado","ABCde12")!==321 || lc_apify_post_views($row,"other.user","ABCde12")!==null || lc_apify_post_views($row,"criador.validado","otherpost")!==null){exit(1);} $clip=lc_one("SELECT id FROM clips LIMIT 1"); if(!$clip || !lc_apify_observe((int)$clip["id"],321)){exit(1);} echo "APIFY_CONTRACT_OK\\n";'
          php -r 'require "app/core.php"; require "app/apify.php"; $usage=lc_apify_usage(); if($usage["runs"]!==0){exit(1);} echo "APIFY_BUDGET_OK\\n";'

          php -r 'require "app/core.php"; require "app/drive.php"; $plain="refresh-token-for-ci-only"; $enc=lc_drive_encrypt_token($plain); if(lc_drive_decrypt_token($enc)!==$plain || str_contains($enc,$plain) || lc_drive_url("javascript:bad")!==null){exit(1);} echo "DRIVE_CRYPTO_OK\\n";'
          php -r 'require "app/core.php"; require "app/drive.php"; $encrypted=lc_drive_encrypt_token("ci-fixture"); lc_query("INSERT INTO google_drive_connections(id,refresh_token_enc,folder_id) VALUES(1,?,?)",[$encrypted,"folder1234567890"]); $saved=lc_drive_connection(); if(!$saved||$saved["refresh_token_enc"]==="ci-fixture"||lc_drive_decrypt_token($saved["refresh_token_enc"])!=="ci-fixture"){exit(1);} lc_query("DELETE FROM google_drive_connections WHERE id=1"); echo "DRIVE_STORAGE_OK\\n";'
          python3 tests/ws_smoke.py || { tail -n 120 /tmp/leaguecut-ws.log; exit 1; }
