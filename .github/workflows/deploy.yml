name: Publicar LeagueCut (apos testes)
on:
  workflow_run:
    workflows:
      - Teste integrado LeagueCut
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite PUBLICAR para fazer o deploy manual'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leaguecut-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLICAR') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Preparar chave SSH
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

      - name: Publicar somente o LeagueCut com rollback
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          REV="$1"
          BASE="/home/leaguecut"
          RELEASE="$BASE/releases/$REV"

          [ "$(id -un)" = leaguecut ] || { echo "ERR: usuario inesperado"; exit 1; }
          [ -r "$BASE/shared/.env" ] || { echo "ERR: arquivo .env privado ausente"; exit 1; }
          [ -L "$BASE/current" ] || { echo "ERR: current nao e um symlink; abortando"; exit 1; }

          CURRENT_MAIN="$(git ls-remote https://github.com/vitoryvensreis/leaguecut.git refs/heads/main | cut -f1)"
          if [ "$CURRENT_MAIN" != "$REV" ]; then
            echo "Novo commit ja existe na main; ignorando versao antiga $REV"
            exit 0
          fi

          mkdir -p "$BASE/releases" "$BASE/shared/storage"
          if [ ! -d "$RELEASE/.git" ]; then
            [ ! -e "$RELEASE" ] || { echo "ERR: release parcialmente existente; abortando"; exit 1; }
            TEMP="$(mktemp -d "$BASE/releases/.deploy.XXXXXX")"
            trap 'rm -rf -- "$TEMP"' EXIT
            git clone -q --depth 1 --branch main \
              https://github.com/vitoryvensreis/leaguecut.git "$TEMP/project"
            cd "$TEMP/project"
            git fetch -q --depth 1 origin "$REV"
            git checkout -q --detach "$REV"
            mv "$TEMP/project" "$RELEASE"
          fi

          cd "$RELEASE"
          [ "$(git rev-parse HEAD)" = "$REV" ] || { echo "ERR: revisao incorreta"; exit 1; }
          if [ -e "$RELEASE/.env" ] && [ ! -L "$RELEASE/.env" ]; then
            echo "ERR: .env nao pode ser arquivo local da release"; exit 1
          fi
          ln -sfn "$BASE/shared/.env" "$RELEASE/.env"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          find app public bin -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          # VAPID is generated only in the private VPS .env, as the leaguecut user.
          # Do not print, upload or commit any key; flags remain unchanged/off.
          php bin/push-vapid-setup.php mailto:vitoryvensreisdeoliveira@gmail.com
          php -r 'require "app/core.php"; require "vendor/autoload.php"; require "app/push-sender.php"; if(!lc_push_vapid_configured())exit(1); echo "LEAGUECUT_VAPID_CONFIGURED=1\n";'
          php bin/migrate.php
          php -r 'require "app/core.php"; lc_db()->query("SELECT COUNT(*) FROM users"); lc_db()->query("SELECT COUNT(*) FROM homepage_banners"); lc_db()->query("SELECT COUNT(*) FROM realtime_events"); echo "DB OK\n";'

          PREV="$(readlink -f "$BASE/current" || true)"
          if [ "$PREV" = "$RELEASE" ]; then
            echo "Essa versao ja esta publicada: $REV"
            exit 0
          fi

          ln -s "$RELEASE" "$BASE/current.next"
          mv -Tf "$BASE/current.next" "$BASE/current"
          OK=0
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 12 \
                 https://leaguecut.com/health | grep -Fxq 'LeagueCut OK' &&
               curl --fail --silent --show-error --max-time 12 \
                 https://leaguecut.com/cadastrar >/dev/null; then
              OK=1
              break
            fi
            sleep 2
          done
          if [ "$OK" -ne 1 ]; then
            echo "ERR: validacao publica falhou; voltando versao anterior"
            if [ -n "$PREV" ] && [ -d "$PREV" ]; then
              ln -s "$PREV" "$BASE/current.rollback"
              mv -Tf "$BASE/current.rollback" "$BASE/current"
            fi
            exit 1
          fi
          # PWA diagnostics query CloudPanel Nginx directly, bypassing Cloudflare WAF.
          # Advisory only: origin-local TLS/routes may differ from public access.
          for pwa_route in pwa/manifest pwa/worker pwa/icon/192 pwa/icon/512; do
            pwa_result="$(curl -k -sS -o /dev/null -w '%{http_code} %{content_type}' \
              --connect-timeout 4 --max-time 20 \
              --resolve leaguecut.com:443:127.0.0.1 \
              "https://leaguecut.com/$pwa_route" 2>/dev/null || true)"
            echo "PWA_ORIGIN_CHECK $pwa_route $pwa_result"
          done
          # Apply the approved social card only after public health checks.
          # Do not overwrite future changes made via ADM > SEO.
          if ! php bin/activate-social-share.php; then
            echo "ERR: arte social invalida; restaurando release anterior"
            if [ -n "$PREV" ] && [ -d "$PREV" ]; then
              ln -s "$PREV" "$BASE/current.rollback"
              mv -Tf "$BASE/current.rollback" "$BASE/current"
            fi
            exit 1
          fi
          # Reliable local scheduler: cron runs at minute zero every hour, while the
          # command itself checks for 02:00 in America/Fortaleza, regardless of
          # the host timezone. The GitHub scheduled workflow remains a fallback.
          if command -v crontab >/dev/null 2>&1; then
            USER_CRON="$(crontab -l 2>/dev/null || true)"
            if ! printf '%s\n' "$USER_CRON" | grep -Fq '# LEAGUECUT_APIFY_02H_MANAGED'; then
              {
                printf '%s\n' "$USER_CRON"
                printf '%s\n' '# LEAGUECUT_APIFY_02H_MANAGED'
                printf '%s\n' '0 * * * * cd /home/leaguecut/current && /usr/bin/php bin/sync-apify-views.php --fortaleza-02 >> /home/leaguecut/logs/apify-cron.log 2>&1'
              } | crontab -
            fi
            if crontab -l | grep -Fq '# LEAGUECUT_APIFY_02H_MANAGED'; then
              echo 'APIFY_VPS_CRON_02H_INSTALLED'
            else
              echo 'ERR: VPS Apify cron was not installed'
              exit 1
            fi
          else
            echo 'APIFY_VPS_CRON_UNAVAILABLE: GitHub Actions schedule remains active'
          fi
          # Register exactly one LeagueCut worker cron; no new listening port or service.
          if command -v crontab >/dev/null 2>&1; then
            CURRENT_CRON="$(crontab -l 2>/dev/null || true)"
            if ! printf '%s\n' "$CURRENT_CRON" | grep -Fq '# LEAGUECUT_AUTOMATIONS_MANAGED'; then
              {
                printf '%s\n' "$CURRENT_CRON"
                printf '%s\n' '# LEAGUECUT_AUTOMATIONS_MANAGED'
                printf '%s\n' '* * * * * cd /home/leaguecut/current && /usr/bin/flock -n /tmp/leaguecut-automations.lock /usr/bin/php bin/automation-worker.php >> /home/leaguecut/logs/automations.log 2>&1'
              } | crontab -
            fi
            crontab -l | grep -Fq '# LEAGUECUT_AUTOMATIONS_MANAGED' || { echo 'ERR: automations worker cron was not installed'; exit 1; }
            echo 'LEAGUECUT_AUTOMATIONS_CRON_INSTALLED'
            # Install under the already-validated leaguecut Unix user, never root/TaskEsc.
            CURRENT_CRON="$(crontab -l 2>/dev/null || true)"
            if ! printf '%s\n' "$CURRENT_CRON" | grep -Fq '# LEAGUECUT_SECURITY_PRUNE_MANAGED'; then
              {
                printf '%s\n' "$CURRENT_CRON"
                printf '%s\n' '# LEAGUECUT_SECURITY_PRUNE_MANAGED'
                printf '%s\n' '15 3 * * * cd /home/leaguecut/current && /usr/bin/flock -n /tmp/leaguecut-security-prune.lock /bin/sh -c "/usr/bin/php bin/audit-prune.php && /usr/bin/php bin/otp-prune.php" >> /home/leaguecut/logs/security-prune.log 2>&1'
              } | crontab -
            fi
            crontab -l | grep -Fq '# LEAGUECUT_SECURITY_PRUNE_MANAGED' ||
              { echo 'ERR: cron de retenção de auditoria/OTP não configurado'; exit 1; }
            echo 'LEAGUECUT_SECURITY_PRUNE_INSTALLED'
          fi
          echo "LEAGUECUT_PUBLICADO=$REV"
          REMOTE
