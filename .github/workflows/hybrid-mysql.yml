name: Hybrid MySQL migration gate
on:
  pull_request:
    paths:
      - 'database/schema.sql'
      - 'database/migrations/*hybrid*.sql'
      - 'tests/hybrid-mysql-smoke.sql'
      - '.github/workflows/hybrid-mysql.yml'
  workflow_dispatch:
jobs:
  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: leaguecut_test
          MYSQL_USER: leaguecut_ci
          MYSQL_PASSWORD: ci_password_not_production
          MYSQL_ROOT_PASSWORD: ci_root_not_production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_not_production"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for MySQL service
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u leaguecut_ci -pci_password_not_production --silent; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Import fresh schema and rerun additive migration
        env:
          MYSQL_PWD: ci_password_not_production
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -u leaguecut_ci leaguecut_test < database/schema.sql
          mysql -h 127.0.0.1 -u leaguecut_ci leaguecut_test < database/migrations/20261014_hybrid_verification.sql
          mysql -h 127.0.0.1 -u leaguecut_ci leaguecut_test < database/migrations/20261014_hybrid_verification.sql
          mysql -h 127.0.0.1 -u leaguecut_ci leaguecut_test < tests/hybrid-mysql-smoke.sql
