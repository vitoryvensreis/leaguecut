name: Diagnostico seguro WhatsApp LeagueCut
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpp-diagnostic.yml'
  workflow_run:
    workflows: ['Publicar LeagueCut (apos testes)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leaguecut-wpp-diagnostic
  cancel-in-progress: true
jobs:
  diagnostico:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preparar SSH privado
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Consultar estados sem divulgar tokens ou QR Code
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/leaguecut/current && php' <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/core.php';
          require 'app/automation-engine.php';
          require 'app/automation-whatsapp.php';
          $allowed=['CONNECTED','ISLOGGED','INCHAT','OPEN','QRCODE','INITIALIZING','STARTING','CLOSED','ERROR','DISCONNECTED','CONNECTING','PHONECODE','CLOSING'];
          echo 'SESSION=leaguecut'.PHP_EOL;
          foreach(['status-session','check-connection-session','qrcode-session'] as $endpoint){
              try {
                  $result=lc_wpp_admin_request($endpoint);
                  $raw=$result['json']['status']??null;
                  $status=is_bool($raw)?($raw?'TRUE':'FALSE'):(is_string($raw)?strtoupper(trim($raw)):'UNKNOWN');
                  if(!in_array($status,$allowed,true)&&$status!=='TRUE'&&$status!=='FALSE')$status='UNKNOWN';
                  $qr=lc_wpp_admin_extract_qr($result)!==null?'yes':'no';
                  echo $endpoint.' status='.$status.' qr_available='.$qr.PHP_EOL;
              }catch(Throwable $e){
                  echo $endpoint.' request_failed='.get_class($e).' kind='.(str_contains($e->getMessage(),'HTTP 404')?'HTTP_404':(str_contains($e->getMessage(),'HTTP 500')?'HTTP_500':(str_contains($e->getMessage(),'HTTP 401')?'HTTP_401':'OTHER'))).PHP_EOL;
              }
          }
          try{
              $state=lc_wpp_admin_status();
              echo 'LEAGUECUT_CONNECTED='.($state['connected']?'YES':'NO').' source='.$state['source'].' state='.$state['status'].PHP_EOL;
          }catch(Throwable $e){
              echo 'LEAGUECUT_STATUS_ERROR='.get_class($e).PHP_EOL;
          }
          PHP
      - name: Saude do runtime WPPConnect sem dados privados
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "WPP_RUNTIME_HEALTH"
          ps -eo stat=,comm= | awk '
            /node/ {nodes++}
            /chrome|chromium/ {chromes++; if ($1 ~ /^Z/) zombies++}
            END {printf "NODE_PROCESSES=%d CHROMIUM_PROCESSES=%d CHROMIUM_ZOMBIES=%d\n", nodes+0,chromes+0,zombies+0}'
          awk '/^MemAvailable:/ {printf "MEMORY_AVAILABLE_KB=%d\n",$2}' /proc/meminfo
          # Print only aggregate process data; never expose argv, tokens, or profile paths.
          ps -eo user=,comm= | awk '$2=="node" {total++; if($1=="leaguecut") mine++} END {printf "NODE_OWNED_BY_LEAGUECUT=%d TOTAL_NODE=%d\\n",mine+0,total+0}'
          leaguecut_profiles=0
          for proc in /proc/[0-9]*/cmdline; do
            pid="${proc%/cmdline}"
            if [ -r "$pid/comm" ] && grep -Eq '^(chrome|chromium)' "$pid/comm" 2>/dev/null; then
              argv="$(tr '\\000' ' ' < "$proc" 2>/dev/null || true)"
              case "$argv" in *--user-data-dir=*leaguecut*) leaguecut_profiles=$((leaguecut_profiles+1));; esac
            fi
          done
          echo "CHROMIUM_EXPLICIT_LEAGUECUT_PROFILE_COUNT=$leaguecut_profiles"
          df -Pk /tmp | awk 'NR==2 {printf "TMP_DISK_AVAILABLE_KB=%d\n",$4}'
          if command -v systemctl >/dev/null 2>&1; then
            systemctl list-units --type=service --all --no-legend --no-pager 2>/dev/null | awk 'tolower($1) ~ /(wppconnect|whatsapp)/ {print "WPP_SERVICE_PRESENT=yes"; found=1} END {if(!found) print "WPP_SERVICE_PRESENT=not-visible"}'
          fi
          REMOTE
