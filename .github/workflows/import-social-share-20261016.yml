name: Importar arte social LeagueCut (temporário)
on:
  push:
    branches:
      - feat/social-share-clean-preview-20261016
    paths:
      - .github/workflows/import-social-share-20261016.yml
permissions:
  contents: write
jobs:
  import-social-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importar arte aprovada, validar bytes e registrar no Git
        env:
          ART_SOURCE: https://at.adobe.com/dsCXR2u39bPt0WEt
        shell: bash
        run: |
          set -euo pipefail
          dest="public/assets/leaguecut-share-clean-2026.jpg"
          curl -fsSL --retry 4 --max-time 90 "$ART_SOURCE" -o "$dest"
          printf '%s  %s\n' 'a4d9749dd38008bd9dca3453ee6076c86fbd49a868280a2565461417ac293a4c' "$dest" | sha256sum --check -
          test "$(stat -c %s "$dest")" -eq 61999
          file --mime-type "$dest" | grep -q 'image/jpeg'
          git config user.name "leaguecut-ci"
          git config user.email "actions@users.noreply.github.com"
          git add "$dest"
          git commit -m "assets: importar imagem social limpa aprovada (1200x630)"
          git push origin HEAD:feat/social-share-clean-preview-20261016
